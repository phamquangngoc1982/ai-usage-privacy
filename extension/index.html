<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Usage</title>
<link rel="stylesheet" href="style.css">
<script defer src="providers.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<main>
<header>
<h1>AI Usage</h1>
<button id="open" type="button" class="quiet">Mở bảng ↗</button>
</header>
<section class="controls">
<button id="refresh">Cập nhật tất cả</button>
<button id="add-service" class="quiet">+ Thêm dịch vụ</button>
<label class="auto" title="Cập nhật trực tiếp ChatGPT/Codex và Claude mỗi 15 phút">
<input id="auto" type="checkbox"> Tự cập nhật
</label>
</section>
<a class="button quiet" id="tray-download" href="https://github.com/phamquangngoc1982/ai-usage-privacy/releases/latest/download/AI-Usage-Tray-Setup.exe" target="_blank" rel="noopener">Cài Tray Windows</a>
<button id="tray" type="button" class="quiet">Kết nối khay Windows</button>
<p id="notice" role="status" hidden></p>
<section id="cards" aria-label="Hạn mức từng dịch vụ"></section>
<dialog id="catalog" aria-labelledby="catalog-title">
<div class="catalog-head"><h2 id="catalog-title">Thêm dịch vụ</h2><button id="close-catalog" class="quiet" aria-label="Đóng">×</button></div>
<div id="choices"></div>
</dialog>
</main>
</body>
</html>
